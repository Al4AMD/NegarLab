[project]
name = "negarlab-api"
version = "0.0.0"
description = "NegarLab image-processing API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pillow>=11",
  "numpy>=2.0",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/negarlab_api/api/routes/*.py" = ["B008"]

[[tool.mypy.overrides]]
module = ["cv2"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
